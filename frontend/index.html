<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartCart - Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .hero {
    text-align: center;
    padding: 60px 20px 40px;
  }

  .hero h1 {
    font-size: 42px;
    margin-bottom: 12px;
  }

  .hero p {
    color: var(--text-muted);
    max-width: 560px;
    margin: 0 auto;
    font-size: 16px;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 40px;
    margin-bottom: 20px;
  }

  .section-head h2 {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-head .view-all {
    color: var(--gold);
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: 13px;
  }

  .section-head .view-all:hover {
    color: var(--gold-hover);
  }

  .recommendation-section {
    margin: 40px 0;
  }

  .recommendation-section h2 {
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    font-size: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .recommendation-section h2 .section-icon {
    font-size: 28px;
  }

  .product-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
  }

  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }

  .rating-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 8px 0;
  }

  .stars {
    color: #f0a531;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .rating-text {
    font-weight: 600;
    color: var(--text);
  }

  .review-count {
    font-size: 12px;
    color: var(--text-muted);
  }

  .trending-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: linear-gradient(135deg, #f0a531, #f77f00);
    color: white;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(240, 165, 49, 0.4);
    z-index: 1;
  }

  .empty-rec {
    text-align: center;
    color: var(--text-muted);
    padding: 20px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="brand">Smart<span>Cart</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="orders.html">My Orders</a>
    <a href="notifications.html" class="nav-bell" title="Notifications">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="bell-badge" id="bellBadge" style="display:none;">0</span>
    </a>
    <a href="database.html">Database</a>
  </nav>
  <div id="userBadge"></div>
</div>

<!-- Hero Section -->
<div class="hero">
  <h1>Shop smarter with SmartCart</h1>
  <p>Smart recommendations based on your browsing history, purchases, and top-rated products.</p>
  <div style="margin-top: 20px; display:flex; gap:14px; justify-content:center;">
    <a href="products.html" style="text-decoration:none;">
      <button class="btn" style="width:auto; padding:12px 28px;">Browse Products</button>
    </a>
    <a href="login.html" style="text-decoration:none;">
      <button class="btn secondary" style="width:auto; padding:12px 28px;">Login / Sign Up</button>
    </a>
  </div>
</div>

<div class="container">

  <!-- Featured Products -->
  <div class="section-head">
    <h2>✨ Featured Products</h2>
    <a href="products.html" class="view-all">View all →</a>
  </div>
  <div id="featuredSection" class="grid"></div>

  <!-- Recommended For You -->
  <div id="recommendedSection" class="recommendation-section"></div>

  <!-- Because You Bought -->
  <div id="becauseYouBoughtSection" class="recommendation-section"></div>

  <!-- Trending Now -->
  <div id="trendingSection" class="recommendation-section"></div>

  <!-- Top Rated -->
  <div id="topRatedSection" class="recommendation-section"></div>

</div>

<script src="js/api.js"></script>
<script src="js/recommendations.js"></script>
<script>
  // =============================================
  // STAR RATING HELPER
  // =============================================
  function starString(rating) {
    if (!rating || rating === 0) return "";
    const full = Math.round(rating);
    return "★".repeat(full) + "☆".repeat(5 - full);
  }

  // =============================================
  // RENDER PRODUCT CARD
  // =============================================
  function renderProductCard(product) {
    return `
      <div class="card product-card">
        ${product.popularity > 100 ? `<span class="trending-badge">🔥 Hot</span>` : ""}
        <h3>${product.name}</h3>
        <p style="color:var(--text-muted); font-size:13px;">${product.description || ""}</p>
        <div class="rating-row">
          ${product.average_rating > 0 ? `
            <span class="stars">${starString(product.average_rating)}</span>
            <span class="rating-text">${product.average_rating}</span>
            <span class="review-count">(${product.review_count} review${product.review_count === 1 ? "" : "s"})</span>
          ` : `
            <span style="color:var(--text-muted); font-size:12px;">No ratings yet</span>
          `}
        </div>
        <p class="price">$${product.price.toFixed(2)}</p>
        <p class="stock">${product.stock > 0 ? product.stock + " in stock" : "Out of stock"} ${product.category ? "· " + product.category : ""}</p>
        <button class="btn" ${product.stock <= 0 ? "disabled style='opacity:0.5;cursor:not-allowed;'" : ""} onclick="addToCart('${product.id}')">Add to Cart</button>
      </div>
    `;
  }

  // =============================================
  // ADD TO CART
  // =============================================
  async function addToCart(productId) {
    if (!Auth.isLoggedIn()) {
      window.location.href = "login.html";
      return;
    }
    try {
      await apiRequest("/cart/add", { method: "POST", auth: true, body: { product_id: productId, quantity: 1 } });
      alert("Added to cart!");
    } catch (err) {
      alert(err.message);
    }
  }

  // =============================================
  // LOAD FEATURED PRODUCTS
  // =============================================
  async function loadFeaturedProducts() {
    const grid = document.getElementById("featuredSection");
    if (!grid) return;
    
    try {
      const products = await ProductsAPI.list();
      const featured = [...products].sort((a, b) => b.popularity - a.popularity).slice(0, 6);
      
      if (!featured.length) {
        grid.innerHTML = `<div class="empty-state">No products available yet.</div>`;
        return;
      }
      
      const productCards = [];
      for (const p of featured) {
        try {
          const reviewData = await ReviewsAPI.forProduct(p.id);
          productCards.push(renderProductCard({...p, average_rating: reviewData.average_rating, review_count: reviewData.total_reviews}));
        } catch {
          productCards.push(renderProductCard({...p, average_rating: 0, review_count: 0}));
        }
      }
      
      grid.innerHTML = productCards.join("");
    } catch (err) {
      grid.innerHTML = `<div class="empty-state">Couldn't load featured products.</div>`;
    }
  }

  // =============================================
  // LOAD TRENDING PRODUCTS
  // =============================================
  async function loadTrending() {
    const section = document.getElementById("trendingSection");
    if (!section) return;
    
    try {
      const trending = await RecommendationsAPI.trending(6);
      if (!trending.length) {
        section.innerHTML = "";
        return;
      }
      
      section.innerHTML = `
        <h2><span class="section-icon">🔥</span> Trending Now</h2>
        <div class="grid">
          ${trending.map(p => renderProductCard(p)).join("")}
        </div>
      `;
    } catch (err) {
      section.innerHTML = "";
    }
  }

  // =============================================
  // LOAD TOP RATED PRODUCTS
  // =============================================
  async function loadTopRated() {
    const section = document.getElementById("topRatedSection");
    if (!section) return;
    
    try {
      const homeData = await RecommendationsAPI.home(6);
      if (!homeData.top_rated || !homeData.top_rated.length) {
        section.innerHTML = "";
        return;
      }
      
      section.innerHTML = `
        <h2><span class="section-icon">⭐</span> Top Rated</h2>
        <div class="grid">
          ${homeData.top_rated.map(p => renderProductCard(p)).join("")}
        </div>
      `;
    } catch (err) {
      section.innerHTML = "";
    }
  }

  // =============================================
  // LOAD RECOMMENDED FOR YOU (NO AUTH NEEDED)
  // =============================================
  async function loadRecommended() {
    const section = document.getElementById("recommendedSection");
    if (!section) return;
    
    try {
      const data = await RecommendationsAPI.forMe(6);
      
      // ALWAYS show recommendations
      section.innerHTML = `
        <h2><span class="section-icon">🎯</span> Recommended For You</h2>
        <div class="grid">
          ${data.recommendations.map(p => renderProductCard(p)).join("")}
        </div>
      `;
    } catch (err) {
      console.error("Failed to load recommendations:", err);
      // Fallback: Show trending products
      try {
        const trending = await RecommendationsAPI.trending(6);
        section.innerHTML = `
          <h2><span class="section-icon">🎯</span> Recommended For You</h2>
          <div class="grid">
            ${trending.map(p => renderProductCard(p)).join("")}
          </div>
        `;
      } catch {
        section.innerHTML = `<div class="empty-rec">No recommendations available</div>`;
      }
    }
  }

  // =============================================
  // LOAD BECAUSE YOU BOUGHT
  // =============================================
  async function loadBecauseYouBought() {
    const section = document.getElementById("becauseYouBoughtSection");
    if (!section) return;
    
    try {
      const data = await RecommendationsAPI.forMe(6);
      if (!data.because_you_bought || !data.because_you_bought.length) {
        section.innerHTML = "";
        return;
      }
      
      section.innerHTML = `
        <h2><span class="section-icon">🛒</span> Because You Bought</h2>
        <div class="grid">
          ${data.because_you_bought.map(p => renderProductCard(p)).join("")}
        </div>
      `;
    } catch (err) {
      section.innerHTML = "";
    }
  }

  // =============================================
  // INITIALIZE ON PAGE LOAD
  // =============================================
  document.addEventListener("DOMContentLoaded", () => {
    loadFeaturedProducts();
    loadTrending();
    loadTopRated();
    loadRecommended();
    loadBecauseYouBought();
  });
</script>

</body>
</html>
