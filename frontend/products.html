<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products · Smart E-Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .stars { color: #f0a531; font-size: 14px; letter-spacing: 1px; }
  .review-summary { font-size: 12px; color: var(--text-muted); margin: 4px 0 10px; cursor: pointer; }
  .review-summary:hover { color: var(--gold); }
  
  .recommendation-section {
    margin: 40px 0;
    padding: 20px;
    background: var(--surface-2);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  
  .recommendation-section h2 {
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    font-size: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .product-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
  }
  
  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }
  
  .rating-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 8px 0;
  }
  
  .rating-text {
    font-weight: 600;
    color: var(--text);
  }
  
  .review-count {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  .similar-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 8px;
    width: 100%;
    font-family: var(--font-body);
  }
  
  .similar-btn:hover {
    background: rgba(240, 165, 49, 0.1);
  }
</style>
</head>
<body>

<div class="navbar">
  <div class="brand">Smart<span>Cart</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="orders.html">My Orders</a>
    <a href="notifications.html" class="nav-bell" title="Notifications">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="bell-badge" id="bellBadge" style="display:none;">0</span>
    </a>
    <a href="database.html">Database</a>
  </nav>
  <div id="userBadge"></div>
</div>

<div class="container">
  <h1>Products</h1>
  <p style="color:var(--text-muted);">Browse the catalog. Log in as a customer to add items to your cart.</p>

  <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:20px;">
    <select id="categoryFilter" style="padding:10px 14px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);">
      <option value="">All categories</option>
    </select>
    <select id="sortFilter" style="padding:10px 14px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);">
      <option value="">Sort: default</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="popularity-desc">Most popular</option>
    </select>
    <label style="display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:14px;">
      <input type="checkbox" id="inStockFilter" /> In stock only
    </label>
  </div>

  <div id="grid" class="grid"></div>

  <!-- Trending Products Section -->
  <div id="trendingSection" class="recommendation-section"></div>

  <!-- Similar Products Section (loaded on demand) -->
  <div id="similarProductsSection" class="recommendation-section" style="display:none;"></div>
</div>

<script src="js/api.js"></script>
<script src="js/recommendations.js"></script>
<script>
  const categoryFilter = document.getElementById("categoryFilter");
  const sortFilter = document.getElementById("sortFilter");
  const inStockFilter = document.getElementById("inStockFilter");

  function buildQuery() {
    const params = new URLSearchParams();
    if (categoryFilter.value) params.set("category", categoryFilter.value);
    if (inStockFilter.checked) params.set("in_stock", "true");
    const sort = sortFilter.value;
    if (sort === "price-asc") { params.set("sort_by", "price"); params.set("order", "asc"); }
    if (sort === "price-desc") { params.set("sort_by", "price"); params.set("order", "desc"); }
    if (sort === "popularity-desc") { params.set("sort_by", "popularity"); params.set("order", "desc"); }
    return params.toString();
  }

  async function loadCategories() {
    try {
      const products = await ProductsAPI.list();
      const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        categoryFilter.appendChild(opt);
      });
    } catch (err) { /* silently ignore */ }
  }

  async function loadProducts() {
    const grid = document.getElementById("grid");
    try {
      const query = buildQuery();
      const products = await apiRequest(`/products/${query ? "?" + query : ""}`);
      if (!products.length) {
        grid.innerHTML = `<div class="empty-state">No products match these filters.</div>`;
        return;
      }
      
      grid.innerHTML = products.map(p => `
        <div class="card product-card">
          <h3>${p.name}</h3>
          <p style="color:var(--text-muted); font-size:13px;">${p.description || ""}</p>
          <div class="rating-row">
            <span class="stars" id="stars-${p.id}"></span>
            <span class="rating-text" id="ratingText-${p.id}"></span>
            <span class="review-count" id="reviewCount-${p.id}"></span>
          </div>
          <p class="price">$${p.price.toFixed(2)}</p>
          <p class="stock">${p.stock > 0 ? p.stock + " in stock" : "Out of stock"} ${p.category ? "· " + p.category : ""}</p>
          <p class="review-summary" id="reviewSummary-${p.id}" onclick="openReviews('${p.id}', '${p.name.replace(/'/g, "\\'")}')"></p>
          <button class="btn" ${p.stock <= 0 ? "disabled style='opacity:0.5;cursor:not-allowed;'" : ""} onclick="addToCart('${p.id}')">Add to Cart</button>
          <button class="similar-btn" onclick="showSimilarProducts('${p.id}', '${p.name.replace(/'/g, "\\'")}')">🔍 View Similar Products</button>
        </div>
      `).join("");

      products.forEach(p => loadReviewSummary(p.id));
    } catch (err) {
      grid.innerHTML = `<div class="empty-state">Couldn't load products. Is the FastAPI server running at ${API_BASE_URL}?</div>`;
    }
  }

  async function addToCart(productId) {
    if (!Auth.isLoggedIn()) {
      window.location.href = "login.html";
      return;
    }
    try {
      await apiRequest("/cart/add", { method: "POST", auth: true, body: { product_id: productId, quantity: 1 } });
      alert("Added to cart!");
    } catch (err) {
      alert(err.message);
    }
  }

  categoryFilter.addEventListener("change", loadProducts);
  sortFilter.addEventListener("change", loadProducts);
  inStockFilter.addEventListener("change", loadProducts);

  loadCategories();
  loadProducts();
  loadTrendingProducts();

  function starString(rating) {
    if (!rating || rating === 0) return "";
    const full = Math.round(rating);
    return "★".repeat(full) + "☆".repeat(5 - full);
  }

  async function loadReviewSummary(productId) {
    const el = document.getElementById(`reviewSummary-${productId}`);
    const starsEl = document.getElementById(`stars-${productId}`);
    const ratingTextEl = document.getElementById(`ratingText-${productId}`);
    const reviewCountEl = document.getElementById(`reviewCount-${productId}`);
    
    if (!el) return;
    
    try {
        const data = await ReviewsAPI.forProduct(productId);
        
        if (data && data.total_reviews > 0) {
            // Update stars display
            if (starsEl) starsEl.textContent = starString(data.average_rating);
            if (ratingTextEl) ratingTextEl.textContent = data.average_rating;
            if (reviewCountEl) reviewCountEl.textContent = `(${data.total_reviews} review${data.total_reviews === 1 ? "" : "s"})`;
            
            // Update summary
            el.innerHTML = `<span class="stars">${starString(data.average_rating)}</span> ${data.average_rating} (${data.total_reviews} review${data.total_reviews === 1 ? "" : "s"})`;
        } else {
            // No reviews - clear loading text
            if (starsEl) starsEl.textContent = "";
            if (ratingTextEl) ratingTextEl.textContent = "";
            if (reviewCountEl) reviewCountEl.textContent = "";
            el.innerHTML = `No reviews yet`;
        }
    } catch (err) {
        // If API fails, show "No reviews yet" instead of "Loading..."
        if (starsEl) starsEl.textContent = "";
        if (ratingTextEl) ratingTextEl.textContent = "";
        if (reviewCountEl) reviewCountEl.textContent = "";
        el.innerHTML = `No reviews yet`;
        console.warn(`Failed to load reviews for ${productId}:`, err);
    }
  }

  async function openReviews(productId, productName) {
    let data;
    try {
      data = await ReviewsAPI.forProduct(productId);
    } catch (err) {
      alert("Couldn't load reviews: " + err.message);
      return;
    }

    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;";
    overlay.innerHTML = `
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); max-width:600px; width:100%; max-height:85vh; overflow-y:auto; padding:28px; box-shadow:var(--shadow);">
        <button onclick="this.closest('div[style*=fixed]').remove()" style="float:right; background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer;">&times;</button>
        <h2 style="margin:0 0 4px;">${productName}</h2>
        <p style="color:var(--text-muted); margin:0 0 16px;">
          <span class="stars">${starString(data.average_rating)}</span> ${data.average_rating} · ${data.total_reviews} review${data.total_reviews === 1 ? "" : "s"}
        </p>

        ${data.top_reviews.length ? `
          <h4 style="margin:16px 0 8px; font-size:13px; text-transform:uppercase; color:var(--text-muted); font-family:var(--font-mono);">Top Reviews</h4>
          ${data.top_reviews.map(r => `
            <div style="border-bottom:1px solid var(--border); padding:10px 0;">
              <span class="stars">${starString(r.rating)}</span> <strong>${r.user_name}</strong>
              <p style="margin:4px 0 0; font-size:14px;">${r.comment || ""}</p>
            </div>
          `).join("")}
        ` : ""}

        <h4 style="margin:20px 0 8px; font-size:13px; text-transform:uppercase; color:var(--text-muted); font-family:var(--font-mono);">All Reviews</h4>
        ${data.reviews.length ? data.reviews.map(r => `
          <div style="border-bottom:1px solid var(--border); padding:10px 0;">
            <span class="stars">${starString(r.rating)}</span> <strong>${r.user_name}</strong>
            <span style="color:var(--text-muted); font-size:12px; margin-left:8px;">${new Date(r.created_at).toLocaleDateString()}</span>
            <p style="margin:4px 0 0; font-size:14px;">${r.comment || ""}</p>
          </div>
        `).join("") : `<p style="color:var(--text-muted); font-size:13px;">No reviews yet.</p>`}
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  }

  // Show similar products for a clicked product
  async function showSimilarProducts(productId, productName) {
    const section = document.getElementById("similarProductsSection");
    section.style.display = "block";
    section.innerHTML = `<h2><span class="section-icon">🔄</span> You May Also Like (Similar to ${productName})</h2><div class="empty-rec">Loading similar products...</div>`;
    
    try {
      const similar = await RecommendationsAPI.similar(productId, 6);
      if (!similar.length) {
        section.innerHTML = `<h2><span class="section-icon">🔄</span> You May Also Like</h2><div class="empty-rec">No similar products found.</div>`;
        return;
      }
      
      section.innerHTML = `
        <h2><span class="section-icon">🔄</span> You May Also Like (Similar to ${productName})</h2>
        <div class="grid">
          ${similar.map(p => `
            <div class="card product-card">
              <h3>${p.name}</h3>
              <p style="color:var(--text-muted); font-size:13px;">${p.description || ""}</p>
              <div class="rating-row">
                <span class="stars">${starString(p.average_rating)}</span>
                <span class="rating-text">${p.average_rating || "N/A"}</span>
                <span class="review-count">(${p.review_count} reviews)</span>
              </div>
              <p class="price">$${p.price.toFixed(2)}</p>
              <p class="stock">${p.stock > 0 ? p.stock + " in stock" : "Out of stock"}</p>
              <button class="btn" ${p.stock <= 0 ? "disabled style='opacity:0.5;cursor:not-allowed;'" : ""} onclick="addToCart('${p.id}')">Add to Cart</button>
              <button class="similar-btn" onclick="showSimilarProducts('${p.id}', '${p.name.replace(/'/g, "\\'")}')">🔍 View Similar</button>
            </div>
          `).join("")}
        </div>
      `;
    } catch (err) {
      section.innerHTML = `<h2><span class="section-icon">🔄</span> You May Also Like</h2><div class="empty-rec">Error loading similar products: ${err.message}</div>`;
    }
  }
</script>

</body>
</html>
